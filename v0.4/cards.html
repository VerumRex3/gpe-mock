<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カード一覧 v0.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #0d1114; color: #e8eef0;
    font: 500 16px/1.7 "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
  h1 { margin: 0; font-weight: 800; font-size: 32px; }
  header a { color: #9fd3de; }
  h2 { margin: 40px 0 4px; font-weight: 800; font-size: 22px; color: #ecbd42; }
  .lead { margin: 0 0 8px; color: #b9cdd2; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 12px; }
  .tile { position: relative; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tile canvas { display: block; max-width: 100%; height: auto; }
  .count {
    position: absolute; top: -8px; right: -8px; min-width: 38px; padding: 0 8px; border-radius: 16px;
    background: #ecbd42; color: #2a1e00; font-weight: 800; font-size: 18px; text-align: center; line-height: 32px;
  }
  figcaption { font-size: 14px; color: #9fb7bd; text-align: center; max-width: 210px; }
  #boot { color: #9fb7bd; margin-top: 24px; }
</style>

<main>
